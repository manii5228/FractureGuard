project:
  name: FractureGuard
  task: pediatric_wrist_fracture_triage
  target_python: "3.11"
  random_seed: 42

cohort:
  primary:
    initial_exam_only: true
    exclude_diagnosis_uncertain: true
    exclude_cast_from_clean_test: true
    exclude_metal_from_clean_test: true
    supported_projections:
      - ap
      - pa
      - lateral

split:
  unit: patient_id
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15
  seed: 42

models:
  baseline: yolo11n
  primary: yolo26n
  accuracy_comparator: yolo26s
  deployment_candidate: yolo26n_int8

evaluation:
  bootstrap_unit: patient_id
  bootstrap_iterations: 2000
  confidence_level: 0.95
  primary_metric: study_level_sensitivity

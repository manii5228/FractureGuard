[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fractureguard"
version = "0.1.0"
description = "Leakage-safe data auditing and research tooling for pediatric wrist fracture triage"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "AGPL-3.0-or-later"
authors = [
  { name = "FractureGuard Project Team" }
]
dependencies = [
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<3.0",
  "Pillow>=13.0,<14.0",
  "PyYAML>=6.0,<7.0",
  "requests>=2.32,<3.0",
  "tqdm>=4.67,<5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.9,<1.0",
]
web = [
  "Django[argon2]>=5.2.19,<5.3",
  "cryptography>=50.0.2,<51",
  "pyotp>=2.9,<3.0",
  "reportlab>=4.4,<5.0",
  "waitress>=3.0.2,<4.0",
]
ml = [
  "matplotlib>=3.9,<4.0",
  "onnx>=1.17,<2.0",
  "onnxruntime>=1.20,<2.0",
  "scikit-learn>=1.6,<2.0",
  "scipy>=1.14,<2.0",
  "seaborn>=0.13,<1.0",
  "torch>=2.5,<3.0",
  "torchvision>=0.20,<1.0",
  "ultralytics>=8.4,<9.0",
]

[project.scripts]
fractureguard = "fractureguard.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fractureguard.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
